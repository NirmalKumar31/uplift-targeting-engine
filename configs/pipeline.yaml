# Paths are relative to the project root.

paths:
  raw_dir: data/raw
  warehouse: data/warehouse.duckdb
  releases_dir: releases
  marts_dir: data/marts  # committed copy of the active release's marts
  historical_snapshot: snapshots/2026-10-25_pre_remediation
  historical_manifest: docs/evidence/2026-10-25_pre_remediation_manifest.json

dataset:
  base_url: https://huggingface.co/datasets/pytorch-lifestream/retailhero-uplift/resolve/main/data
  files:
    clients.csv.gz: b8985170e03dc65fa532fb6b8ca6dd70ea5c30c35ea7c1019ee6ea2034d04099
    products.csv.gz: 6b72e025ff77974940ebdba63998a4349ae290a33efeb41f29989fdea6e96573
    purchases.csv.gz: 1342e14e1aa9d39dc242f1b66c903f0576fd184af9dc5a3bbe932607dc2d8aba
    uplift_train.csv.gz: 23aced68634c605acb93a7ab450aabac1a0ce0c8104e59ffed9941109ddc4ccd
    uplift_test.csv.gz: 8b98fe6ee94478253f40e7ed7ebbbefeb47c78ab37fd41111f3b35b8b69373e0
  # Feature cutoff: day after the last purchase. The exact SMS send time is not published.
  as_of: "2019-03-19 00:00:00"

experiment:
  seed: 42
  n_folds: 5
  outer_folds: 5
  n_bootstrap: 500
  noise_rankings: 200

models:
  candidates: [random, response, s_learner, t_learner, x_learner, class_transformation, dr_learner]
  ensemble_top_k: 3  # 0 disables the ensemble
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_lambda: 5.0
    verbose: -1

calibration:
  n_bins: 20

economics:
  # Assumptions for a public dataset; replace with real figures.
  currency: RUB
  sms_cost: 3.0
  gross_margin: 0.246  # X5's reported 2019 gross margin
  margin_per_purchase: null  # null = mean basket x gross_margin

campaign:
  campaign_id: x5-sms-demo-2019-03
  holdout_share: 0.10

monitoring:
  psi_warn: 0.10
  psi_fail: 0.25
