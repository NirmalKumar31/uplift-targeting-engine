name: uplift_warehouse
version: "1.0.0"
config-version: 2
profile: uplift_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# `as_of` (the feature cutoff) has no default here on purpose: `ute transform`/`ute marts` pass it
# from configs/pipeline.yaml (dataset.as_of), the single source of truth. For a bare dbt call pass
# it explicitly, e.g. --vars '{"as_of": "2019-03-19 00:00:00"}'.

models:
  uplift_warehouse:
    staging:
      +schema: staging
      +materialized: table
      +tags: ["features"]
    features:
      +schema: features
      +materialized: table
      +tags: ["features"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
