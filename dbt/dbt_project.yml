name: uplift_warehouse
version: "1.0.0"
config-version: 2
profile: uplift_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# as_of is passed in by the CLI from configs/pipeline.yaml.

models:
  uplift_warehouse:
    staging:
      +schema: staging
      +materialized: table
      +tags: ["features"]
    features:
      +schema: features
      +materialized: table
      +tags: ["features"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
