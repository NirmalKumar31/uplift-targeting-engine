version: 2

models:
  - name: stg_clients
    data_tests:
      - no_future_dates: {arguments: {columns: [first_issue_date, first_redeem_date]}}
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: gender
        data_tests:
          - accepted_values: {arguments: {values: ['F', 'M', 'U']}}
  - name: stg_transactions
    description: One row per transaction (line items collapsed).
    data_tests:
      - dbt_utils_unique_combination: {arguments: {columns: [client_id, transaction_id]}}
    columns:
      - name: purchase_sum
        data_tests: [not_null]
  - name: stg_experiment
    columns:
      - name: client_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('stg_clients'), field: client_id}}
