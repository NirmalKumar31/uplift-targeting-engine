services:
  dashboard:
    build: .
    ports: ["8501:8501"]
  api:
    build: .
    command: uvicorn uplift_engine.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      # Generated by `uv run ute run` (gitignored). Missing -> /ready answers 503.
      - ./releases:/app/releases:ro
