[project]
name = "uplift-targeting-engine"
version = "1.0.0"
description = "Causal uplift modeling for promotion targeting: DuckDB + dbt feature warehouse, cross-fitted meta-learners, profit-optimal send lists, a scoring API and a BI dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
warehouse = ["dbt-duckdb>=1.8"]
tuning = ["optuna>=4.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
all = ["uplift-targeting-engine[warehouse,tuning,api,dashboard]"]

[project.scripts]
ute = "uplift_engine.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "api", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["uplift_engine"]
branch = true

[tool.ruff.lint.isort]
known-first-party = ["uplift_engine", "common"]
