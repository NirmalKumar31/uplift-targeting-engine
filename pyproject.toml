[project]
name = "uplift-targeting-engine"
version = "2.0.0"
description = "Causal uplift modeling for promotion targeting: DuckDB + dbt feature warehouse, cross-fitted meta-learners, outer-fold policy validation, a scoring API and a BI dashboard."
readme = "README.md"
# Supported and tested: CPython 3.12 from a source checkout (see README "Execution modes").
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Minimums are the lowest versions the test suite has been run against
# (`uv run --isolated --resolution lowest-direct --all-extras pytest`); see docs/AUDIT_REMEDIATION.md.
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "numpy>=2.0",  # np.trapezoid
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
warehouse = ["dbt-duckdb>=1.10"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.52", "plotly>=6.0"]  # st.metric(delta_arrow=) is 1.52+
all = ["uplift-targeting-engine[warehouse,api,dashboard]"]

[project.scripts]
ute = "uplift_engine.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]
browser = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
markers = [
    "integration: end-to-end runs on the raw fixture (dbt, models, API); ~minutes",
]

[tool.coverage.run]
source = ["uplift_engine"]
branch = true

[tool.ruff.lint.per-file-ignores]
# The page template is HTML; wrapping it would change the generated markup.
"scripts/build_site.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["uplift_engine", "common"]
